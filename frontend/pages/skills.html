<!DOCTYPE html>

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <script src="../assets/vendor/lucide.min.js" defer></script>
  <script type="module" src="../js/pages/skills.js"></script>
</head>

      <nav class="nav" data-nav-menu id="nav-menu" aria-label="Main navigation">
        <ul class="nav__list" role="list">
          <li>
            <a class="nav__link" href="../index.html#home" data-nav-link>Home</a>
          </li>
          <li>

          <i data-lucide="menu"></i>

        </button>
