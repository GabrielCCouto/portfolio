  <link rel="stylesheet" href="../css/responsive.css">

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <script src="../assets/vendor/lucide.min.js" defer></script>
  <script type="module" src="../js/pages/skills.js"></script>
</head>

        <p class="section-description">
          Technologies and tools I work with to build intelligent and efficient solutions.
        </p>
      </header>

      <div class="skills-grid" data-skills-grid></div>

      <div class="page-social">
